plugins { id 'com.android.application' }

android {
    namespace 'com.epicstreaming.app'
    compileSdk 35
    buildFeatures { buildConfig true }

    defaultConfig {
        applicationId 'com.epicstreaming.app'
        minSdk 9
        targetSdk 28
        versionCode 8
        versionName '1.7'
    }

    flavorDimensions += 'androidUi'
    productFlavors {
        legacy {
            dimension 'androidUi'
            applicationIdSuffix '.legacy'
            minSdk 9
            versionNameSuffix '-legacy'
        }
        modern {
            dimension 'androidUi'
            minSdk 22
            versionNameSuffix '-modern'
        }
    }
}
